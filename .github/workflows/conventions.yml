name: Naming policy
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  naming:
    name: Naming conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate branch, commits and PR title
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/check-conventions.ps1 -SelfTest
          ./scripts/check-conventions.ps1 -BaseRef "origin/$env:BASE_BRANCH" -HeadRef $env:HEAD_SHA -BranchName $env:BRANCH_NAME -PrTitle $env:PR_TITLE
